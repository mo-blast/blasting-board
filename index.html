    <!-- Batas akhir elemen visual Anda -->
    <button class="audio-btn" id="audio-control" onclick="togglePlay()">🔊 Aktifkan Sirine</button>

    <!-- Pastikan ada pembuka tag script di sini -->
    <script>
        // 1. Logika Filter Halaman Admin
        if (window.location.search.includes('admin')) {
            document.getElementById('hp-panel').style.display = 'block';
            document.getElementById('main-dash').style.display = 'none';
            document.getElementById('audio-control').style.display = 'none';
        }

        // 2. SISTEM INSTAN CACHE
        const defaultData = {
            date: "19 / 08 / 2026",
            time: "14.45 WITA",
            location: "Harapan West Quary"
        };

        const localCached = localStorage.getItem('vale_blasting_local');
        const initialData = localCached ? JSON.parse(localCached) : defaultData;

        function renderToUI(data) {
            if(!data) return;
            document.getElementById('lbl-date').innerText = data.date || "";
            document.getElementById('lbl-time').innerText = data.time || "";
            document.getElementById('lbl-location').innerText = data.location || "";
            
            if (window.location.search.includes('admin')) {
                document.getElementById('inp-date').value = data.date || "";
                document.getElementById('inp-time').value = data.time || "";
                document.getElementById('inp-location').value = data.location || "";
            }
        }
        renderToUI(initialData);

        // 3. Hubungkan ke Database di Latar Belakang
        const gun = Gun({
            peers: [
                'https://herokuapp.com',
                'https://herokuapp.com',
                'https://herokuapp.com'
            ],
            localStorage: true
        });
        const blastingNode = gun.get('vale_blasting_mo_blast_2026');

        blastingNode.on(function(data) {
            if(data && (data.date || data.time || data.location)) {
                renderToUI(data);
                localStorage.setItem('vale_blasting_local', JSON.stringify(data));
            }
        });

        function sendDataToCloud(e) {
            e.preventDefault();
            const d = document.getElementById('inp-date').value;
            const t = document.getElementById('inp-time').value;
            const l = document.getElementById('inp-location').value;
            const newData = { date: d, time: t, location: l };

            localStorage.setItem('vale_blasting_local', JSON.stringify(newData));
            
            blastingNode.put(newData, function(ack){
                alert("Data berhasil diproses dan dikirim!");
            });
        }

        // Kontrol Suara Sirine
        const audio = document.getElementById("sirineAudio");
        const btn = document.getElementById("audio-control");
        function togglePlay() {
            if (audio.paused) {
                audio.play().catch(e => console.log("Izin audio aktif"));
                btn.innerText = "⏸ Matikan Sirine";
            } else {
                audio.pause();
                btn.innerText = "🔊 Aktifkan Sirine";
            }
        }
    </script> <!-- Pastikan ada penutup tag script di sini -->
</body>
</html>
