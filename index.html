<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PT Vale Indonesia - Digital Blasting Board</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #072214 0%, #03110a 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(46, 204, 113, 0.03);
            border-radius: 50%;
            filter: blur(120px);
            top: -10%; right: -10%;
            pointer-events: none;
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 1100px;
            background: rgba(10, 31, 20, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        /* Header Area Kunci Statis Super Mewah */
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 25px;
            gap: 25px;
        }

        .header-title-container {
            display: flex;
            align-items: baseline;
            gap: 15px;
            flex-wrap: wrap;
        }

        .main-title {
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
        }

        .sub-title {
            color: #6a8573;
            font-size: 1.6rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Logo Box */
        .brand-logo {
            height: 65px;
            width: 160px;
            background: #ffffff;
            padding: 10px 14px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 8px 24 rgba(0, 0, 0, 0.4);
        }

        .brand-logo img {
            height: 100%;
            width: 100%;
            object-fit: contain;
        }

        /* Info Grid Layout */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 26px 30px;
            border-radius: 20px;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.02);
        }

        .full-width {
            grid-column: span 2;
            border-left: 5px solid #f1c40f;
            background: linear-gradient(90deg, rgba(241, 196, 15, 0.03) 0%, rgba(0,0,0,0) 100%);
        }

        .label {
            font-size: 0.85rem;
            color: #8fa896;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .value {
            font-size: 2.6rem;
            font-weight: 700;
            color: #ffffff;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        .location-value {
            color: #f1c40f;
            font-size: 2.6rem;
            font-weight: 700;
            margin-top: 8px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 30px rgba(241, 196, 15, 0.15);
        }

        /* Dynamic Status Panel */
        .status-panel {
            color: #ffffff;
            padding: 22px;
            border-radius: 18px;
            font-size: 1.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: background 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        /* Test Button */
        .test-audio-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #435749;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .test-audio-btn:hover {
            border-color: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.6);
        }

        @media (max-width: 768px) {
            .header-area { flex-direction: column-reverse; align-items: center; gap: 15px; }
            .header-title-container { justify-content: center; text-align: center; flex-direction: column; align-items: center; gap: 5px; }
            .main-title { font-size: 2.4rem; }
            .sub-title { font-size: 1.2rem; }
            .info-grid { grid-template-columns: 1fr; gap: 15px; }
            .full-width { grid-column: span 1; }
            .value, .location-value { font-size: 2.1rem; }
            .status-panel { font-size: 1.2rem; padding: 18px 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- HEADER AREA STATIS ANTI-HILANG -->
    <div class="header-area">
        <div class="header-title-container">
            <span class="main-title">BLASTING</span> 
            <span class="sub-title">• BLASTING SCHEDULE •</span>
        </div>
        <div class="brand-logo">
            <img src="logo-vale.png" alt="PT Vale Logo">
        </div>
    </div>

    <!-- CLEAN DATA GRID -->
    <div class="info-grid">
        <div class="info-box">
            <div class="label">DATE</div>
            <!-- EDIT JADWAL TANGGAL DI SINI -->
            <div class="value" id="blasting-date">13 / 08 / 2026</div>
        </div>

        <div class="info-box">
            <div class="label">TARGET TIME</div>
            <!-- EDIT JADWAL JAM DI SINI -->
            <div class="value" id="blasting-time">16:45 WITA</div>
        </div>

        <div class="info-box full-width">
            <div class="label">LOCATION</div>
            <!-- EDIT JADWAL LOKASI DI SINI -->
            <div class="location-value" id="blasting-location">KONDE SOUTH 09</div>
        </div>
    </div>

    <!-- MOOD STATUS PANEL -->
    <div class="status-panel" id="status-banner">
        SYSTEM ACTIVE
    </div>

</div>

<button class="test-audio-btn" onclick="testSiren()">🔊 TEST MANUAL SIREN</button>

<script>
  const audio = new Audio('sirine.mp3');
  let played = false;

  // Layar otomatis me-refresh dirinya sendiri setiap 10 detik agar sinkronisasi HP lancar
  setTimeout(function(){
     location.reload();
  }, 10000);

  function checkSirenTime() {
    const timeElement = document.getElementById('blasting-time');
    if (!timeElement) return;

    const timeText = timeElement.textContent.trim();
    const match = timeText.match(/(\d{2}):(\d{2})/);
    if (!match) return;
    
    const targetHour = parseInt(match[10]);
    const targetMinute = parseInt(match[10]);

    const now = new Date();
    const targetTime = new Date();
    targetTime.setHours(targetHour, targetMinute, 0, 0);
    
    const sirenTime = new Date(targetTime.getTime() - 15000); 
    const banner = document.getElementById('status-banner');

    if (now < sirenTime) {
      banner.style.background = "linear-gradient(135deg, #d35400 0%, #e67e22 100%)"; 
      banner.style.boxShadow = "0 10px 30px rgba(211, 84, 0, 0.25)";
      banner.innerHTML = "⚠️ BLASTING PREPARATION / AREA RESTRICTED";
    } else if (now >= sirenTime && now < targetTime) {
      if (!played) {
        audio.play().catch(e => console.log("Audio target enabled."));
        played = true;
      }
      banner.style.background = "linear-gradient(135deg, #c0392b 0%, #e74c3c 100%)"; 
      banner.style.boxShadow = "0 10px 30px rgba(192, 57, 43, 0.4)";
      banner.innerHTML = "🚨 SIREN ACTIVE! 15 SECONDS BEFORE BLASTING 🚨";
    } else if (now >= targetTime) {
      banner.style.background = "linear-gradient(135deg, #27ae60 0%, #2ecc71 100%)"; 
      banner.style.boxShadow = "0 10px 30px rgba(39, 174, 96, 0.25)";
      banner.innerHTML = "✓ BLASTING COMPLETED / AREA CLEARED";
    }
  }

  setInterval(checkSirenTime, 1000);

  function testSiren() {
    audio.currentTime = 0; 
    audio.play()
      .then(() => alert("Siren peripheral connection verified successfully."))
      .catch(err => alert("Audio stream error. Check file named 'sirine.mp3'."));
  }
</script>

</body>
</html>
